name: Build and Publish Subiksha TTS APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup environment and keystore
        run: |
          # Ensure .env exists from example
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          
          # Generate debug.keystore if not committed
          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          # Ensure gradlew has execute permission
          chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK binary
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Subiksha_TTS_v1.0.apk
          echo "APK successfully prepared at release-output/Subiksha_TTS_v1.0.apk"
          ls -lh release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Subiksha_TTS_APK
          path: release-output/Subiksha_TTS_v1.0.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Subiksha Teacher App - Tamil Female Voice Studio v1.0.${{ github.run_number }}
          body: |
            ## சுபிக்ஷா டீச்சர் செயலி (Subiksha Teacher App) - Tamil Female TTS Studio
            
            ### புதிய அம்சங்கள் (Features):
            * ✦ IIT Madras AI4Bharat IndicF5 Zero-Shot Tamil Voice Cloning (அசல் Bae விஸ்பர் குரல் குளோனிங்)
            * ✦ ElevenLabs Multilingual Neural Voice Integration (User Pre-configured Key)
            * ✦ 15 வகை பெண் குரல் டோன்கள் (15 Female Tones with Instant Previews)
            * ✦ 10 வகை குரல் மாடுலேஷன்கள் (10 Voice Modulations) & 14 தனித்துவமான பெண் குரல் பாணிகள்
            * ✦ சுருதி (Pitch: 78%), பேச்சு வேகம் (Speed: 1.0x), விஸ்பர் கட்டுப்பாடுகள்
            * ✦ தரம் குறையாத 24kHz WAV ஆடியோ பதிவிறக்கம் (Lossless WAV Audio Download)
            * ✦ Tanglish to Natural Tamil Phonetic Speech (இயற்கையான உச்சரிப்பு)
            
            ### நிறுவும் முறை (Installation):
            1. கீழே உள்ள `Subiksha_TTS_v1.0.apk` கோப்பைப் பதிவிறக்கவும் (Download).
            2. உங்கள் ஆண்ட்ராய்டு மொபைலில் திறந்து 'Install' செய்யவும்.
          files: release-output/Subiksha_TTS_v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
